<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holocrón Galáctico</title>
<!--FUENTES-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<!--/FUENTES-->
<style>
/* Layout: una biblioteca de holocrones. Estante de tomos como lomos verticales,
   lector a ~66 caracteres con índice lateral y fichas como lecturas de datos en monoespaciada. */
:root {
  --bg: #0c0e13;
  --bg-2: #13161e;
  --bg-3: #1b1f29;
  --fg: #e7e3d7;
  --fg-2: #a39f93;
  --line: #2a2f3b;
  --brass: #d3aa55;
  --brass-soft: rgba(211, 170, 85, .13);
  --prop: #7cc4d6;
  --prop-soft: rgba(124, 196, 214, .12);
  --auth: #9cc58a;
  --auth-soft: rgba(156, 197, 138, .13);
  --star: 231, 227, 215;

  --f-display: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
  --f-body: 'Literata', Georgia, 'Times New Roman', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, 'Courier New', monospace;

  --step--1: .82rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.55rem;
  --step-3: 2.1rem;
  --step-4: clamp(2.6rem, 6vw, 4.6rem);

  --radius: 6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceef2; --bg-2: #f8f9fb; --bg-3: #e1e4ea; --fg: #1a1d25; --fg-2: #565c69; --line: #cdd2da;
    --brass: #8a6418; --brass-soft: rgba(138, 100, 24, .11); --prop: #1d6b80; --prop-soft: rgba(29, 107, 128, .1);
    --auth: #3f6b2b; --auth-soft: rgba(63, 107, 43, .1); --star: 40, 46, 60;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceef2; --bg-2: #f8f9fb; --bg-3: #e1e4ea; --fg: #1a1d25; --fg-2: #565c69; --line: #cdd2da;
  --brass: #8a6418; --brass-soft: rgba(138, 100, 24, .11); --prop: #1d6b80; --prop-soft: rgba(29, 107, 128, .1);
  --auth: #3f6b2b; --auth-soft: rgba(63, 107, 43, .1); --star: 40, 46, 60;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--step-0)/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: var(--brass); text-underline-offset: 3px; }
a:hover { color: var(--brass); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
img { max-width: 100%; }

.wrap { max-width: 1180px; margin-inline: auto; padding-inline: 20px; }
.label, .eyebrow {
  font: 500 .72rem/1.3 var(--f-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.eyebrow { color: var(--brass); }
.muted { color: var(--fg-2); }
.mono { font-family: var(--f-mono); }

/* ------------------------------------------------ barra superior */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: center; gap: 18px; min-height: 56px; }
.brand {
  font: 700 1rem/1 var(--f-display);
  letter-spacing: .12em;
  text-decoration: none;
  white-space: nowrap;
  display: flex; align-items: center; gap: 10px;
}
.brand-mark {
  width: 18px; height: 18px; border: 1.5px solid var(--brass); transform: rotate(45deg);
  display: grid; place-items: center;
}
.brand-mark::after { content: ''; width: 6px; height: 6px; background: var(--brass); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  font: 500 .78rem/1 var(--f-mono);
  letter-spacing: .06em;
  text-decoration: none;
  padding: 9px 10px;
  border-radius: 4px;
  color: var(--fg-2);
  white-space: nowrap;
}
.nav a:hover { color: var(--fg); background: var(--bg-3); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--brass-soft); }
.tools { display: flex; gap: 6px; }
.tool-btn {
  font: 500 .72rem/1 var(--f-mono);
  letter-spacing: .05em;
  color: var(--fg-2);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 9px;
  cursor: pointer;
  white-space: nowrap;
}
.tool-btn:hover { color: var(--fg); border-color: var(--fg-2); }
@media (max-width: 1000px) {
  .topbar-in { flex-wrap: wrap; gap: 8px 12px; padding-block: 10px; }
  .nav { order: 3; flex-basis: 100%; }
  .tools { margin-left: auto; }
}

/* ------------------------------------------------ marcas de canon */
.prop { border-bottom: 1px dotted var(--prop); cursor: help; }
.hide-prop .prop { border-bottom: 0; }
.badge {
  display: inline-block;
  font: 500 .64rem/1 var(--f-mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 4px 6px;
  border-radius: 3px;
  vertical-align: middle;
  white-space: nowrap;
}
.b-o { color: var(--brass); background: var(--brass-soft); }
.b-a { color: var(--auth); background: var(--auth-soft); }
.b-p { color: var(--prop); background: var(--prop-soft); }
.badges { display: inline-flex; gap: 4px; flex-wrap: wrap; }

.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--fc, var(--fg-2)); flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font: 500 .74rem/1 var(--f-mono);
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;
  color: var(--fg);
  background: transparent;
  cursor: pointer;
}
a.chip:hover, button.chip:hover { border-color: var(--fg-2); color: var(--fg); }
button.chip[aria-pressed="true"] { background: var(--bg-3); border-color: var(--fg-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 .82rem/1 var(--f-mono);
  letter-spacing: .04em;
  padding: 12px 16px;
  border-radius: 4px;
  text-decoration: none;
  background: var(--brass);
  color: var(--bg);
  border: 1px solid var(--brass);
  cursor: pointer;
}
.btn:hover { color: var(--bg); filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--brass); color: var(--brass); filter: none; }

/* ------------------------------------------------ portada */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-in { position: relative; padding-block: 72px 64px; display: grid; gap: 22px; }
.hero-title {
  font: 700 var(--step-4)/.98 var(--f-display);
  letter-spacing: .04em;
}
.hero-title span { color: var(--brass); }
.lede { font-size: var(--step-1); max-width: 40ch; line-height: 1.55; }
.hero-meta { font: 400 .8rem/1.6 var(--f-mono); color: var(--fg-2); }
.hero-meta b { color: var(--fg); font-weight: 500; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }

.block { padding-block: 56px 8px; }
.sec-head { display: grid; gap: 8px; margin-bottom: 26px; max-width: 68ch; }
.sec-head h2 { font: 700 var(--step-2)/1.15 var(--f-display); letter-spacing: .03em; }
.sec-head p { color: var(--fg-2); }

/* balance de poder */
.power { display: grid; gap: 10px; margin-bottom: 26px; }
.power-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 2px; }
.power-bar span { background: var(--fc); display: block; }
.power-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 .76rem/1.4 var(--f-mono); color: var(--fg-2); }
.power-legend span { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }

.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.status {
  display: grid; gap: 8px; align-content: start;
  padding: 18px 18px 18px 20px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--fc);
  border-radius: var(--radius);
  text-decoration: none;
}
.status:hover { color: inherit; border-color: var(--fg-2); border-left-color: var(--fc); }
.status h3 { font: 600 1.05rem/1.25 var(--f-body); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.status p { font-size: .92rem; color: var(--fg-2); }
.pill { font: 500 .68rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); background: var(--bg-3); padding: 5px 7px; border-radius: 3px; white-space: nowrap; }

/* estante de tomos */
.shelf { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; }
.spine {
  position: relative;
  height: var(--h, 320px);
  display: grid;
  grid-template-rows: auto 1fr auto;
  justify-items: center;
  gap: 12px;
  padding: 18px 8px 14px;
  text-decoration: none;
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: 4px 4px 2px 2px;
  transition: transform .25s ease, border-color .25s ease;
}
.spine:hover { transform: translateY(-6px); border-color: var(--brass); color: inherit; }
.spine-bands { position: absolute; top: 0; left: 0; right: 0; height: 4px; display: flex; border-radius: 4px 4px 0 0; overflow: hidden; }
.spine-bands i { flex: 1; background: var(--fc); }
.spine-num { font: 700 1.6rem/1 var(--f-display); color: var(--brass); }
.spine-title {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font: 600 1rem/1.15 var(--f-display);
  letter-spacing: .05em;
  text-align: left;
  max-height: 100%;
  overflow: hidden;
}
.spine-years { font: 400 .66rem/1.3 var(--f-mono); color: var(--fg-2); text-align: center; font-variant-numeric: tabular-nums; }
@media (max-width: 820px) {
  .shelf { grid-template-columns: 1fr; gap: 8px; }
  .spine { height: auto; grid-template-columns: 56px 1fr; grid-template-rows: auto auto; justify-items: start; align-items: center; gap: 2px 12px; padding: 16px 14px 14px; }
  .spine-num { grid-row: span 2; justify-self: center; }
  .spine-title { writing-mode: horizontal-tb; transform: none; font-size: 1.02rem; }
  .spine-years { text-align: left; }
  .spine:hover { transform: none; }
}

.legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.legend-item { display: grid; gap: 8px; padding: 16px 0; border-top: 1px solid var(--line); }
.legend-item p { font-size: .92rem; color: var(--fg-2); }

/* ------------------------------------------------ lector de tomos */
.page { padding-block: 34px 80px; }
.crumbs { font: 400 .76rem/1.4 var(--f-mono); color: var(--fg-2); margin-bottom: 26px; }
.crumbs a { text-decoration: none; }
.tomo-head { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: end; padding-bottom: 28px; border-bottom: 1px solid var(--line); margin-bottom: 34px; }
.tomo-num { font: 700 clamp(4rem, 12vw, 7.5rem)/.8 var(--f-display); color: var(--brass); letter-spacing: .02em; }
.tomo-head h1 { font: 700 var(--step-3)/1.1 var(--f-display); letter-spacing: .02em; margin: 8px 0 14px; }
@media (max-width: 560px) { .tomo-head { grid-template-columns: 1fr; gap: 6px; } }

.reader-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; align-items: start; }
.toc { position: sticky; top: 84px; display: grid; gap: 14px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: c; }
.toc li a {
  display: grid; grid-template-columns: 22px 1fr; gap: 6px;
  font-size: .88rem; line-height: 1.35;
  text-decoration: none; color: var(--fg-2);
  padding: 6px 8px; border-radius: 4px;
}
.toc li a:hover { color: var(--fg); background: var(--bg-3); }
.toc li a span { font: 500 .72rem/1.6 var(--f-mono); color: var(--brass); }
.toc-pager { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.toc-pager a { font: 400 .76rem/1.4 var(--f-mono); text-decoration: none; color: var(--fg-2); }
@media (max-width: 900px) {
  .reader-grid { grid-template-columns: 1fr; gap: 26px; }
  .toc { position: static; padding: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); }
}

.prose { max-width: 68ch; min-width: 0; }
.record { margin: 0 0 34px; padding: 18px 20px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: 10px; }
.record figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.record blockquote { margin: 0; font-style: italic; line-height: 1.65; }
.record .note { font: 400 .76rem/1.5 var(--f-mono); color: var(--fg-2); }
.synopsis { font-size: var(--step-1); line-height: 1.55; margin-bottom: 44px; color: var(--fg); }

.chapter { padding-top: 10px; margin-bottom: 48px; }
.chapter header { display: grid; gap: 6px; margin-bottom: 20px; }
.chapter h2 { font: 700 var(--step-2)/1.15 var(--f-display); letter-spacing: .02em; }
.ch-src { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chapter > p { font-size: 1.07rem; line-height: 1.78; margin-bottom: 1.05em; hyphens: auto; }
.chapter > p:first-of-type::first-letter {
  font: 700 3.1em/.85 var(--f-display);
  float: left;
  margin: .06em .1em 0 0;
  color: var(--brass);
}
.divider { border: 0; height: 1px; background: var(--line); margin: 52px 0 40px; }

.sheet { display: grid; gap: 14px; margin-bottom: 40px; }
.sheet h2 { font: 700 var(--step-2)/1.15 var(--f-display); letter-spacing: .02em; }
.facts { display: grid; grid-template-columns: 170px minmax(0, 1fr); margin: 0; border-top: 1px solid var(--line); }
.facts dt, .facts dd { padding: 12px 0; border-bottom: 1px solid var(--line); margin: 0; }
.facts dt { font: 500 .72rem/1.6 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); padding-right: 14px; }
.facts dd { font-size: .96rem; }
@media (max-width: 560px) {
  .facts { grid-template-columns: 1fr; }
  .facts dt { border-bottom: 0; padding-bottom: 0; }
}
.hooks { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.hooks li::marker { color: var(--brass); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; }
.pager a {
  display: grid; gap: 4px; padding: 16px; text-decoration: none;
  border: 1px solid var(--line); border-radius: var(--radius);
}
.pager a:hover { border-color: var(--brass); color: inherit; }
.pager a.next { text-align: right; grid-column: 2; }
.pager strong { font: 600 1rem/1.3 var(--f-display); }

/* ------------------------------------------------ facciones */
.fac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.fac-card {
  display: grid; gap: 10px; align-content: start;
  padding: 22px; text-decoration: none;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
  position: relative; overflow: hidden;
}
.fac-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--fc); }
.fac-card:hover { border-color: var(--fg-2); color: inherit; }
.fac-card h3 { font: 700 1.3rem/1.2 var(--f-display); letter-spacing: .02em; }
.fac-card p { font-size: .92rem; color: var(--fg-2); }
.fac-card .lema { font-style: italic; color: var(--fg); }

.fac-head { display: grid; gap: 12px; padding-bottom: 26px; margin-bottom: 30px; border-bottom: 1px solid var(--line); position: relative; }
.fac-head::before { content: ''; width: 64px; height: 4px; background: var(--fc); border-radius: 2px; }
.fac-head h1 { font: 700 var(--step-3)/1.1 var(--f-display); letter-spacing: .02em; }
.fac-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: start; }
.fac-side { position: sticky; top: 84px; display: grid; gap: 16px; padding: 18px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); }
.fac-side dl { margin: 0; display: grid; gap: 12px; }
.fac-side dt { font: 500 .68rem/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); }
.fac-side dd { margin: 2px 0 0; font-size: .92rem; }
@media (max-width: 940px) { .fac-layout { grid-template-columns: 1fr; } .fac-side { position: static; } }
.fac-main { display: grid; gap: 44px; min-width: 0; max-width: 72ch; }
.fac-sec { display: grid; gap: 14px; }
.fac-sec h2 { font: 700 var(--step-2)/1.15 var(--f-display); letter-spacing: .02em; }
.era-list { list-style: none; margin: 0; padding: 0; display: grid; }
.era-list li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 14px; padding-bottom: 18px; position: relative; }
.era-list li::before { content: ''; width: 9px; height: 9px; margin-top: 8px; border: 2px solid var(--fc); border-radius: 50%; background: var(--bg); z-index: 1; }
.era-list li::after { content: ''; position: absolute; left: 6px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
.era-list li:last-child::after { display: none; }
.era-list h3 { font: 600 1rem/1.4 var(--f-body); margin-bottom: 3px; }
.era-list p { font-size: .95rem; color: var(--fg-2); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 520px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 .68rem/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); background: var(--bg-2); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--f-mono); font-size: .8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.unit-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.unit { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.unit h3 { font: 600 1rem/1.4 var(--f-body); }
.unit p { font-size: .94rem; color: var(--fg-2); }
@media (max-width: 560px) { .unit { grid-template-columns: 1fr; gap: 4px; } }
.rel { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rel:first-child { border-top: 1px solid var(--line); }
.rel a { font-weight: 600; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.rel p { flex-basis: 100%; font-size: .93rem; color: var(--fg-2); }
.play { padding: 18px 20px; background: var(--brass-soft); border-radius: var(--radius); display: grid; gap: 10px; }

/* ------------------------------------------------ personajes */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; align-items: start; }
.person { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); border-left: 3px solid var(--fc); }
.person summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; gap: 4px; }
.person summary::-webkit-details-marker { display: none; }
.person summary h3 { font: 700 1.12rem/1.25 var(--f-display); letter-spacing: .02em; display: flex; justify-content: space-between; gap: 10px; }
.person summary h3::after { content: '+'; font: 400 1.1rem/1 var(--f-mono); color: var(--fg-2); }
.person[open] summary h3::after { content: '–'; }
.person summary p { font-size: .88rem; color: var(--fg-2); }
.person .body { padding: 0 18px 18px; display: grid; gap: 12px; }
.person .body p { font-size: .95rem; }
.person.flash { border-color: var(--brass); }
.kv { font: 400 .76rem/1.5 var(--f-mono); color: var(--fg-2); }
.kv b { color: var(--fg); font-weight: 500; }

/* ------------------------------------------------ batallas y cronología */
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.row.flash { background: var(--brass-soft); }
.row-year { font: 500 .9rem/1.4 var(--f-mono); color: var(--brass); font-variant-numeric: tabular-nums; }
.row h3 { font: 700 1.15rem/1.3 var(--f-display); letter-spacing: .02em; margin-bottom: 8px; }
.row .facts { grid-template-columns: 130px minmax(0, 1fr); border-top: 0; }
.row .facts dt, .row .facts dd { padding: 6px 0; border-bottom: 0; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 6px; } .row .facts { grid-template-columns: 1fr; } }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.timeline .t-year { font: 500 .82rem/1.5 var(--f-mono); color: var(--brass); font-variant-numeric: tabular-nums; }
.timeline .t-body { display: grid; gap: 6px; }
.timeline .t-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 400 .72rem/1 var(--f-mono); color: var(--fg-2); }
.timeline .t-meta a { text-decoration: none; }
.tl-era { font: 700 .95rem/1.3 var(--f-display); letter-spacing: .06em; color: var(--fg-2); padding: 26px 0 8px; border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .timeline li { grid-template-columns: 1fr; gap: 4px; } }

/* ------------------------------------------------ mapa */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 940px) { .map-layout { grid-template-columns: 1fr; } }
.map-box { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); }
.map-box svg { display: block; width: 100%; min-width: 640px; height: auto; }
.map-ring { fill: none; stroke: var(--line); stroke-width: .25; }
.map-grid { stroke: var(--line); stroke-width: .12; }
.map-sphere { stroke-width: .3; }
.map-pt { cursor: pointer; }
.map-pt circle.core { stroke: var(--bg); stroke-width: .5; }
.map-pt circle.halo { fill: transparent; stroke: var(--brass); stroke-width: .4; opacity: 0; }
.map-pt.sel circle.halo, .map-pt:focus circle.halo { opacity: 1; }
.map-pt:focus { outline: none; }
.map-pt text { font: 500 2.5px var(--f-mono); fill: var(--fg); letter-spacing: .05px; }
.map-pt.dim { opacity: .22; }
.map-route { fill: none; stroke: var(--fg-2); stroke-width: .3; stroke-dasharray: 1 1; }
.map-note { font: 400 2.2px var(--f-mono); fill: var(--fg-2); }
.map-panel { display: grid; gap: 12px; padding: 18px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); }
.map-panel h3 { font: 700 1.2rem/1.25 var(--f-display); }
.map-panel p { font-size: .94rem; }
select {
  font: 500 .8rem/1 var(--f-mono); color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px;
  max-width: 100%; min-width: 0;
}
.map-controls select { flex: 1 1 220px; max-width: 460px; }
.map-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
.map-controls label { font: 500 .72rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); }

/* ------------------------------------------------ glosario y canon */
.gloss { display: grid; grid-template-columns: 230px minmax(0, 1fr); margin: 0; border-top: 1px solid var(--line); }
.gloss dt, .gloss dd { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line); }
.gloss dt { font-weight: 600; padding-right: 16px; display: grid; gap: 6px; align-content: start; justify-items: start; }
.gloss dd { color: var(--fg-2); font-size: .96rem; }
@media (max-width: 640px) { .gloss { grid-template-columns: 1fr; } .gloss dt { border-bottom: 0; padding-bottom: 4px; } }
.qa { display: grid; border-top: 1px solid var(--line); }
.qa div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.qa dt { font-weight: 600; font-size: .95rem; }
.qa dd { margin: 0; color: var(--fg-2); font-size: .95rem; }
@media (max-width: 640px) { .qa div { grid-template-columns: 1fr; gap: 4px; } }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.checklist li { padding: 12px 0 12px 28px; border-bottom: 1px solid var(--line); position: relative; font-size: .95rem; }
.checklist li::before { content: ''; position: absolute; left: 2px; top: 16px; width: 12px; height: 12px; border: 1.5px solid var(--fc, var(--prop)); border-radius: 2px; }
.canon-grid { display: grid; gap: 52px; max-width: 900px; }
.export { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toast { font: 400 .78rem/1.4 var(--f-mono); color: var(--auth); min-height: 1.4em; }
.copy-fallback { width: 100%; min-height: 160px; font: 400 .75rem/1.5 var(--f-mono); background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 10px; }

.footer { border-top: 1px solid var(--line); padding-block: 26px 40px; margin-top: 40px; font: 400 .74rem/1.6 var(--f-mono); color: var(--fg-2); }
.footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }

</style>

<script>/* datos/tomos.js */
/*
  HOLOCRÓN GALÁCTICO — Los Tomos
  -------------------------------------------------------------
  Convenciones de canon:
    base: 'O' = texto Original de la web (2025)
          'A' = decisión del Autor (respuestas del 2 oct 2026)
          'P' = Propuesta de reconstrucción (pendiente de aprobar)
    Dentro del texto, {entre llaves} = detalle propuesto.
  Calendario (propuesta): año 0 = Batalla de Orion-34.
    AO = antes de Orion · DO = después de Orion.
*/
window.LORE = window.LORE || {};

LORE.tomos = [
  /* ============================================================ TOMO I */
  {
    id: 'tomo-1',
    num: 'I',
    titulo: 'La Guerra de las Galaxias Fragmentadas',
    periodo: 'c. 12 AO – 1 DO',
    anios: [-12, 1],
    original: 'El Imperio de Rilur, con su poderío de clones y droides, avanza imparable. La República de Vinica forja una alianza desesperada con los Caballeros de la Sintonía. En la Batalla de Orion-34, el maestro Saelen Vharr derrota a Lord Veylan, pero la victoria es agridulce: el este galáctico, incluyendo Dubitsa, cae. Vinica firma un tratado humillante para sobrevivir.',
    sinopsis: 'El Reactor Oscuro da a Rilur ejércitos casi gratuitos y una expansión sin freno. Vinica, Dubitsa y los Caballeros de la Sintonía se unen y vencen en Lolop, pero el Imperio rodea el frente: el este cae entero y Vinica se rinde con un tratado humillante.',
    capitulos: [
      {
        titulo: 'El fuego de Raqut',
        base: 'A P',
        texto: `
Durante siglos, el Imperio de Rilur había sido la fuerza dominante de la galaxia. Su doctrina se resumía en dos principios que cualquier súbdito sabía recitar: orden y poder. Pero lo que convirtió a aquel imperio antiguo en una marea imparable no fue su doctrina, sino una máquina.

En el mundo de Raqut, {los científicos del Imperio, los mismos que más tarde formarían el núcleo de los Nighul,} lograron encender el Reactor Oscuro. Fuera de Rilur nadie llegó a comprender del todo cómo funcionaba. Lo que sí comprendió la galaxia fueron sus consecuencias: energía y recursos casi ilimitados a un coste casi nulo. Las fundiciones nunca se apagaban, los tanques de clonación trabajaban sin descanso y las cadenas de montaje fabricaban droides de combate por millones.

Un ejército que no cuesta nada no necesita volver a casa. Bajo el {Emperador Sarkon}, Rilur dejó de conquistar sistema a sistema y empezó a avanzar por frentes enteros. Las crónicas de la época describen cielos cubiertos de flotas de desembarco y mundos que se rendían en cuanto veían las legiones de clones en órbita, antes de que se disparara un solo tiro. Los cronistas llamarían a aquella época la Guerra de las Galaxias Fragmentadas: una galaxia rota en mil frentes, todos retrocediendo ante el mismo enemigo.

El reactor tuvo otra consecuencia, más silenciosa. Su energía no era limpia, sino alterada, y al extenderse por la galaxia alteraba también la Sintonía Universal, la energía que conecta todas las cosas. En el santuario de Riqtom, los Caballeros de la Sintonía la sintieron desafinarse como una cuerda tensada hasta el límite. Entonces comprendieron que aquello ya no era una guerra entre estados. Si nadie detenía a Rilur, el desequilibrio acabaría rompiendo algo que nadie podría reparar.`
      },
      {
        titulo: 'La alianza desesperada',
        base: 'O A P',
        texto: `
La República de Vinica fue la primera gran potencia que entendió que no podía ganar sola. Su Senado, acostumbrado a resolverlo todo con comercio y diplomacia, vio cómo sus rutas se cerraban una tras otra y cómo sus flotas de defensa caían ante un enemigo que reponía sus pérdidas en semanas.

La decisión que tomó entonces dividió a la República durante generaciones: Vinica pidió ayuda a los Caballeros de la Sintonía. La orden era antigua, reservada y desconfiaba de la política. Muchos la conocían por su otro nombre, los Caballeros Ocultos, porque rara vez se dejaban ver fuera de sus santuarios. Hacía siglos que unos monjes guerreros no aceptaban luchar al lado de un Senado.

Aceptaron porque el problema no era Vinica ni su libertad, sino el reactor. Los Caballeros que respondieron a la llamada iban encabezados por el maestro Saelen Vharr, {y a su lado combatía un discípulo joven y obstinado llamado Kemet}.

En el este, el Imperio de Dubitsa se unió también. Dubitsa era una civilización ancestral de científicos, filósofos y guerreros disciplinados, y sus estrategas habían hecho los cálculos: al ritmo de producción de Rilur, el este caería en una década. Así nació la coalición de Vinica, Dubitsa y la Sintonía contra el expansionismo de Rilur. Su objetivo era detener al Imperio en el único lugar donde todavía era posible: el sistema Orion-34, en el planeta Lolop.`
      },
      {
        titulo: 'Lolop',
        base: 'O A P',
        texto: `
{Orion-34 era el cruce de rutas entre el núcleo imperial y los mundos del este. Quien lo controlara controlaba el acceso a Dubitsa, a los principados orientales y a buena parte del comercio de Vinica.} Lolop, su planeta principal, fue el escenario de la mayor batalla de la época.

El ejército de Rilur estaba al mando de Lord Veylan, un señor de la guerra imperial {con fama de no haber perdido nunca una campaña}. Veylan no tenía poderes de la Sintonía ni los necesitaba. Tenía clones y droides suficientes para cubrir el planeta y la paciencia de quien sabe que el enemigo se agotará antes que él.

{La batalla duró semanas. Las flotas de Vinica y Dubitsa contuvieron el bloqueo orbital mientras, en la superficie, las legiones imperiales avanzaban sobre las posiciones de la coalición.} Fueron los Caballeros quienes rompieron el equilibrio: {Saelen Vharr dirigió un ataque directo contra el puesto de mando de Veylan, cruzando líneas que ninguna fuerza convencional habría podido atravesar.}

El duelo entre el maestro y el señor de la guerra se convirtió en leyenda. Saelen Vharr derrotó a Lord Veylan, {que no sobrevivió al combate}. Sin su comandante, el ejército imperial de Lolop se desmoronó. Esa noche se celebró en los campamentos de la coalición la primera gran victoria contra Rilur en una generación. {Los cronistas tomarían esa batalla como el año cero de su calendario.}`
      },
      {
        titulo: 'La caída del Este',
        base: 'O P',
        texto: `
La victoria duró lo que tardó Rilur en reponer sus pérdidas.

Mientras la coalición celebraba Lolop, el Reactor Oscuro seguía funcionando. {En pocos meses, las legiones destruidas en Orion-34 ya tenían reemplazo, y el Imperio cambió de estrategia: dejó de atacar el cruce que defendía la coalición y lo rodeó. Nuevas flotas cayeron sobre el este galáctico por rutas que nadie vigilaba.}

El este galáctico cayó entero. Los principados orientales, que nunca habían sabido unirse, fueron conquistados uno por uno. Dubitsa resistió más que ninguno, pero tampoco pudo sostenerse: Rilur aniquiló y absorbió la antigua civilización. {Sus universidades se cerraron, su dinastía fue derrocada y los Pretoni que sobrevivieron pasaron a la clandestinidad.}

Por eso la victoria de Lolop fue agridulce. Saelen Vharr había ganado la batalla, pero la coalición había perdido la guerra.`
      },
      {
        titulo: 'La Paz de Hierro',
        base: 'O P',
        texto: `
Sola y rodeada, la República de Vinica hizo lo único que le permitía seguir existiendo: firmó un tratado humillante para sobrevivir. {Los vinicanos lo llamarían la Paz de Hierro. Vinica conservó su Senado y su capital, pero cedió territorios, aceptó límites a su flota y empezó a pagar tributo al Imperio.} Muchos senadores lo consideraron una traición. Otros sostenían que era la única forma de que Vinica siguiera viva para la próxima guerra.

Los Caballeros de la Sintonía pagaron el precio más alto. {Habían perdido a la mayoría de sus miembros en la campaña, y Rilur los declaró enemigos del Imperio. Saelen Vharr se retiró al santuario de Riqtom con los pocos supervivientes y allí dedicó sus últimos años a formar a Kemet, convencido de que el reactor acabaría devorando la galaxia si nadie lo apagaba.}

Rilur había ganado. {Durante casi dos décadas} impuso una paz de orden y control. Más tarde, en tiempos de caos, muchos la echarían de menos.`
      }
    ],
    ficha: {
      facciones: ['rilur', 'vinica', 'dubitsa', 'sintonia', 'principados'],
      personajes: ['sarkon', 'saelen-vharr', 'veylan', 'kemet'],
      batallas: ['lolop'],
      territorio: 'Rilur conquista todo el este galáctico, incluidos Dubitsa y los principados orientales. Vinica sobrevive, pero reducida y convertida en tributaria.',
      muertes: 'Lord Veylan {(muere en el duelo)}. La mayoría de los Caballeros de la Sintonía. La antigua dinastía de Dubitsa {(derrocada)}.',
      lideres: 'Ninguno nuevo. Rilur sigue bajo {Sarkon}.',
      tecnologia: 'Reactor Oscuro en pleno funcionamiento: energía y recursos casi ilimitados, producción masiva de clones y droides.',
      consecuencias: 'Empieza la paz impuesta de Rilur. La orden queda casi extinta y oculta en Riqtom. Dubitsa desaparece como estado.'
    },
    lugares: ['raqut', 'lolop', 'riqtom', 'vinica-prime', 'dubitsa-prime', 'rilur-prime'],
    juegos: [
      'Campaña RTS de la Batalla de Lolop jugable desde los dos bandos: hordas de Rilur (con reactor, sus unidades cuestan casi nada) contra una coalición escasa pero cualificada.',
      'Misión de héroe: el asalto de Saelen Vharr al puesto de mando de Lord Veylan.'

  },

  /* ============================================================ TOMO II */
  {
    id: 'tomo-2',
    num: 'II',

    periodo: 'c. 8 – 18 DO',
    anios: [8, 18],

    notaOriginal: '«Nizghul» es una errata de «Nighul» (decisión del autor, 2026).',
    sinopsis: 'Bajo la paz impuesta, Kemet se convierte en leyenda. Una facción rebelde destruye la luna-forja de Rilit; el Emperador responde desatando a los Nighul. Kemet golpea el corazón del Imperio y muere junto al Emperador en un duelo. Su última orden: encontrar al Guardián del Bosque.',

      {
        titulo: 'Los años del orden',

La paz de Rilur fue una paz vigilada. Los mundos conquistados recibían energía barata del Reactor Oscuro y, a cambio, aceptaban gobernadores imperiales, guarniciones de clones y patrullas de droides que no dormían nunca. Para muchos fue la época más estable que habían conocido. Para otros fue una jaula.

{Saelen Vharr murió en Riqtom hacia el año 8 DO.} Su discípulo Kemet heredó lo que quedaba de la orden: un puñado de caballeros, un santuario escondido y una misión imposible. Con los años, Kemet se convirtió en una leyenda. {Aparecía donde la opresión imperial era más dura, desaparecía antes de que llegaran las legiones y en cada mundo que visitaba dejaba una célula de resistencia.} Su discípulo más cercano era Raqid, {paciente y metódico, el único a quien Kemet confiaba sus dudas.}

{Esas dudas tenían que ver con una visión. La Sintonía, decía Kemet, había empezado a señalar a alguien que aún no sabía quién era: un guardián ligado a un bosque, capaz de hacer lo que ni él ni su maestro habían logrado.}`
      },
      {
        titulo: 'La forja de Rilit',

        texto: `
{En el año 18 DO,} una facción rebelde logró lo que parecía imposible. Su objetivo fue Rilit, la luna-forja convertida en la mayor instalación militar del Imperio: {astilleros, fábricas de droides y criaderos de clones alimentados directamente por la energía del reactor.}

{Los rebeldes, veteranos de Lolop, exiliados de Dubitsa y saboteadores formados por las células de Kemet, pasaron meses infiltrados entre los trabajadores de la luna. Cuando actuaron, lo hicieron sobre las conducciones de energía. La reacción en cadena destruyó la instalación y Rilit ardió durante días.}

Fue el golpe más duro que había recibido el Imperio desde Lolop, y no solo por las pérdidas materiales. {Por primera vez en dieciocho años, la galaxia vio que Rilur podía sangrar.} Y el Emperador montó en cólera.`
      },
      {
        titulo: 'Los Nighul',
        base: 'O A',
        texto: `
La respuesta del Emperador fue mostrar a la galaxia su élite: los Nighul.

Los Nighul eran la élite de la élite. Se elegían por selección genética entre los mejores guerreros y los mejores clones del Imperio, y pasaban por un entrenamiento intenso e inhumano. Los que lo superaban acumulaban años de veteranía antes de recibir el título. Un solo Nighul equivalía a cien Nizarios, y los Nizarios ya eran la élite del ejército.

Pero lo que los hacía de verdad temibles era su vínculo con el Reactor Oscuro. Su energía alterada los unía mental y energéticamente y potenciaba sus habilidades y sus poderes arcanos. {Combatían como un solo cuerpo y cada uno sabía lo que veían sus hermanos.} Los Caballeros usaban la Sintonía para buscar el equilibrio; el poder de los Nighul era esa misma Sintonía torcida por el reactor.

Además, no eran solo guerreros. Los Nighul eran también los mejores científicos, filósofos e ingenieros de la galaxia. De ahí su prestigio: junto a los Nizarios eran el orgullo de Rilur.

      {
        titulo: 'El duelo',

El legendario Kemet lideró un contraataque que llegó {hasta Rilur Prime}. {Las crónicas no coinciden sobre cómo logró entrar en la ciudadela imperial. Unas hablan de traidores en la guardia; otras, de un asalto desesperado de los últimos caballeros.} Todas coinciden en el final: Kemet y el Emperador se enfrentaron cara a cara.

{Korvan no era un visionario como su predecesor. Era un soldado duro e implacable, y heredaba un imperio que todavía conservaba el reactor. En Rilur Prime nadie imaginaba que la profecía de un caballero muerto acabaría con aquello.}

Raqid salió de la capital entre el humo del duelo. Tardaría cinco años en cumplir la orden.`

    ficha: {
      facciones: ['rilur', 'sintonia'],

      batallas: ['rilit-sabotaje', 'duelo-rilur-prime'],
      territorio: 'Sin grandes cambios: Rilur sigue dominando. La luna-forja de Rilit queda destruida.',
      muertes: '{Saelen Vharr (c. 8 DO, de vejez).} Kemet y el Primer Emperador ({Sarkon}), en el duelo.',
      lideres: '{Korvan}, Gran Mariscal, se convierte en Emperador.',

  /* ============================================================ TOMO III */
  {
    id: 'tomo-3',
    num: 'III',
    titulo: 'El Guardián del Bosque',
    periodo: 'c. 23 – 26 DO',

    P('> **Leyenda:** las marcas de fuente son *Original* (texto literal de la web de 2025), *Autor 2026* (decisiones del autor al reconstruir) y *Propuesta* (reconstrucción pendiente de aprobar). Dentro del texto, **†** marca los detalles propuestos.', '');

    P('## Índice', '');
    P('1. Estado actual de la galaxia', '2. Los Tomos (I–VII)', '3. Códice de Facciones', '4. Personajes', '5. Batallas y acontecimientos', '6. Lugares', '7. Cronología', '8. Glosario', '9. Registro de canon', '');

    P('---', '', '## 1. Estado actual de la galaxia', '');
    P(m(L.epilogo.texto), '');
    P('| Facción | Estado | Peso | Situación |', '|---|---|---|---|');
    L.facciones.filter(f => f.poder != null).forEach(f => {
      P(`| ${f.id === 'andalus' ? 'Restos de Andalus' : f.nombre} | ${f.estado} | ${f.poder} | ${m(f.resumenActual)} |`);
    });
    P('');

    P('---', '', '## 2. Los Tomos', '');
    L.tomos.forEach(t => {
      P(`### Tomo ${t.num} — ${t.titulo}`, '');
      P(`*Periodo: ${m(t.periodo)}*`, '');
      P('**Registro original del Holocrón:**', '', '> ' + t.original, '');
      if (t.notaOriginal) P('*Nota: ' + t.notaOriginal + '*', '');
      P('**Sinopsis.** ' + m(t.sinopsis), '');
      t.capitulos.forEach((c, i) => {
        P(`#### Capítulo ${i + 1}. ${c.titulo}`, '');
        P('*Fuentes: ' + c.base.split(/\s+/).map(k => SRC[k]).join(', ') + '*', '');
        c.texto.trim().split(/\n\s*\n/).forEach(p => P(m(p.trim()), ''));
      });
      const f = t.ficha;
      P('#### Ficha del Tomo', '');
      P('- **Facciones:** ' + f.facciones.map(facName).join(', '));
      P('- **Personajes:** ' + f.personajes.map(perName).join(', '));
      if (f.batallas.length) P('- **Batallas y acontecimientos:** ' + f.batallas.map(batName).join(', '));
      P('- **Cambios territoriales:** ' + m(f.territorio));
      P('- **Muertes:** ' + m(f.muertes));
      P('- **Nuevos líderes:** ' + m(f.lideres));
      P('- **Tecnología:** ' + m(f.tecnologia));
      P('- **Consecuencias:** ' + m(f.consecuencias), '');
      P('#### Para videojuegos', '');
      t.juegos.forEach(j => P('- ' + m(j)));
      P('');
    });
    P('### Epílogo — ' + L.epilogo.titulo, '', m(L.epilogo.texto), '');

    P('---', '', '## 3. Códice de Facciones', '');
    L.facciones.forEach(f => {
      P(`### ${f.nombre}`, '');
      if (f.alias) P('*' + m(f.alias) + '*', '');
      P(`- **Estado actual:** ${f.estado}${f.poder != null ? ' (peso ' + f.poder + ')' : ''}`);
      P('- **Lema:** ' + m(f.lema));
      P('- **Capital / sede:** ' + m(f.capital));
      P('- **Gobierno:** ' + m(f.gobierno), '');
      P('**Códice original:**', '', '> ' + f.codice, '');
      P('**Historia**', '');
      f.historia.forEach(h => P(`- **${m(h.titulo)}.** ${m(h.texto)}`));
      P('', '**Gobernantes y líderes**', '');
      P('| Nombre | Título | Periodo | Nota |', '|---|---|---|---|');
      f.gobernantes.forEach(g => P(`| ${m(g.nombre)} | ${m(g.titulo)} | ${m(g.periodo)} | ${m(g.nota)} |`));
      P('', '**Ejército**', '');
      f.ejercito.forEach(e => P(`- **${m(e.nombre)}:** ${m(e.texto)}`));
      P('', '**Cultura.** ' + m(f.cultura), '');
      P('**Relaciones**', '');
      f.relaciones.forEach(r => P(`- **${facName(r.con)}** (${r.tipo}): ${m(r.texto)}`));
      P('', '**Situación actual.** ' + m(f.resumenActual), '');
      P('**Jugabilidad.** ' + m(f.jugabilidad), '');
      P('**Ganchos narrativos:**', '');
      f.ganchos.forEach(g => P('- ' + m(g)));
      P('');
    });

    P('---', '', '## 4. Personajes', '');
    L.personajes.forEach(p => {
      P(`### ${m(p.nombre)}`, '');
      P(`- **Títulos:** ${m(p.titulos)}`);
      P(`- **Facción:** ${facName(p.faccion)}`);
      P(`- **Vida:** ${m(p.vida)}`);
      P(`- **Papel:** ${m(p.rol)}`);
      P(`- **Tomos:** ${p.tomos.join(', ')}`, '');
      P(m(p.bio), '');
      P('**Destino:** ' + m(p.destino), '');
    });

    P('---', '', '## 5. Batallas y acontecimientos', '');
    L.batallas.slice().sort((a, b) => a.anio - b.anio).forEach(b => {
      P(`### ${m(b.nombre)} — año ${b.anio} DO† · Tomo ${b.tomo}`, '');
      P(`- **Lugar:** ${lugName(b.lugar)}`);
      P(`- **Bandos:** ${m(b.bandos)}`);
      P(`- **Mandos:** ${m(b.mandos)}`);
      P(`- **Resultado:** ${m(b.resultado)}`);
      P(`- **Consecuencias:** ${m(b.consecuencias)}`, '');
    });

    P('---', '', '## 6. Lugares', '');
    P('| Lugar | Tipo | Afiliación | Fuente | Descripción |', '|---|---|---|---|---|');
    L.lugares.forEach(l => P(`| ${m(l.nombre)} | ${m(l.tipo)} | ${m(l.afiliacion)} | ${SRC[l.src]} | ${m(l.texto)} |`));
    P('');

    P('---', '', '## 7. Cronología', '', '*Calendario de trabajo†: año 0 = Batalla de Orion-34; AO = antes, DO = después.*', '');
    L.cronologia.forEach(c => P(`- **${m(c.anio)}** — ${m(c.texto)}${c.tomo ? ' *(Tomo ' + c.tomo + ')*' : ''}`));
    P('');

    P('---', '', '## 8. Glosario', '');
    L.glosario.slice().sort((a, b) => m(a.t).localeCompare(m(b.t), 'es')).forEach(g => P(`- **${m(g.t)}** — ${m(g.d)}`));
    P('');

    P('---', '', '## 9. Registro de canon', '');
    P('### Fuentes', '');
    L.canon.fuentes.forEach(f => P(`- **${f.nombre}**${f.url ? ' — ' + f.url : ''}. ${f.nota}`));
    P('', '### Decisiones del autor (2 oct 2026)', '');
    L.canon.decisiones.forEach(d => P(`- **${d.p}** → ${d.r}`));
    P('', '### Propuestas pendientes de aprobar', '');
    L.canon.propuestas.forEach(x => P('- [ ] ' + x));
    P('', '### Preguntas abiertas', '');
    L.canon.pendientes.forEach(x => P('- [ ] ' + x));
    P('');
    return o.join('\n');
  };

  L.aJSON = function () {
    const datos = {};
    ['epilogo', 'tomos', 'facciones', 'personajes', 'batallas', 'lugares', 'cronologia', 'glosario', 'canon'].forEach(k => { datos[k] = L[k]; });
    return JSON.stringify({
      convenciones: {
        llaves: 'El texto entre {llaves} es una propuesta pendiente de aprobación.',
        src: { O: SRC.O, A: SRC.A, P: SRC.P },
        calendario: 'Año 0 = Batalla de Orion-34 (propuesta). AO = antes, DO = después.'
      },
      ...datos
    }, null, 2);
  };
})();

</script>
<script>/* app.js */
/* Holocrón Galáctico — lector de la Biblia del canon */
(function () {
  const L = window.LORE;
  const app = document.getElementById('app');

  /* ---------------------------------------------------- utilidades */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = s => esc(s).replace(/\{([^{}]+)\}/g, '<span class="prop" title="Propuesta: pendiente de aprobación">$1</span>');
  const plain = s => String(s == null ? '' : s).replace(/[{}]/g, '');
  const paras = s => String(s).trim().split(/\n\s*\n/).map(p => `<p>${fmt(p.trim())}</p>`).join('');
  const fac = id => L.facciones.find(f => f.id === id);
  const per = id => L.personajes.find(p => p.id === id);
  const bat = id => L.batallas.find(b => b.id === id);
  const lug = id => L.lugares.find(l => l.id === id);
  const tomoNum = n => L.tomos.find(t => t.num === n);
  const facColor = id => (fac(id) || {}).color || '#a855f7';
  const SRC = {
    O: { cls: 'b-o', label: 'Original', tip: 'Texto literal de la web original (2025)' },
    A: { cls: 'b-a', label: 'Autor 2026', tip: 'Decisión del autor al reconstruir el canon (2 oct 2026)' },
    P: { cls: 'b-p', label: 'Propuesta', tip: 'Reconstrucción propuesta, pendiente de aprobación' }
  };
  const badge = k => `<span class="badge ${SRC[k].cls}" title="${SRC[k].tip}">${SRC[k].label}</span>`;
  const statusName = f => f.id === 'andalus' ? 'Restos de Andalus' : f.nombre;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
  };
  const facChip = id => {
    const f = fac(id);
    return f ? `<a class="chip" href="#faccion-${f.id}" style="--fc:${f.color}"><i class="dot"></i>${esc(f.nombre)}</a>` : '';
  };
  const perLink = id => { const p = per(id); return p ? `<a href="#personaje-${p.id}">${fmt(p.nombre)}</a>` : esc(id); };
  const batLink = id => { const b = bat(id); return b ? `<a href="#batalla-${b.id}">${fmt(b.nombre)}</a>` : esc(id); };
  const lugLink = id => { const l = lug(id); return l ? `<a href="#lugar-${l.id}">${fmt(l.nombre)}</a>` : esc(id); };
  const tomoLink = n => { const t = tomoNum(n); return t ? `<a href="#${t.id}">Tomo ${n}</a>` : ''; };

  /* ---------------------------------------------------- portada */
  function viewHome() {
    const status = L.facciones.filter(f => f.poder != null);
    const total = status.reduce((a, f) => a + f.poder, 0);
    const maxSpan = Math.max(...L.tomos.map(t => t.anios[1] - t.anios[0]));
    return `
      <section class="hero">
        <canvas class="stars" aria-hidden="true"></canvas>
        <div class="wrap hero-in">
          <p class="eyebrow">Crónica interactiva · Era de las Grandes Guerras y sus Ecos</p>
          <h1 class="hero-title">Holocrón<br><span>Galáctico</span></h1>
          <p class="lede">${fmt(L.epilogo.texto)}</p>
          <p class="hero-meta">Presente del Holocrón: <b>${fmt('{año ' + L.epilogo.presente + '}')}</b> · ${L.tomos.length} Tomos · ${L.facciones.length} facciones · ${L.personajes.length} personajes</p>
          <div class="cta">
            <a class="btn" href="#tomo-1">Empezar por el Tomo I</a>
            <a class="btn ghost" href="#mapa">Abrir el mapa galáctico</a>
          </div>
        </div>
      </section>

      <section class="wrap block">
        <header class="sec-head">
          <p class="eyebrow">Presente</p>
          <h2>Estado actual de la galaxia</h2>
          <p>Las potencias tras la Última Gran Guerra y el peso relativo que les daba el gráfico de la web original.</p>
        </header>
        <div class="power" role="img" aria-label="Balance de poder: ${status.map(f => statusName(f) + ' ' + f.poder + '%').join(', ')}">
          <div class="power-bar">${status.map(f => `<span style="--fc:${f.color};width:${(f.poder / total) * 100}%"></span>`).join('')}</div>
          <div class="power-legend">${status.map(f => `<span><i class="dot" style="--fc:${f.color}"></i>${esc(statusName(f))} · ${f.poder}%</span>`).join('')}</div>
        </div>
        <div class="status-grid">
          ${status.map(f => `
            <a class="status" href="#faccion-${f.id}" style="--fc:${f.color}">
              <h3>${esc(statusName(f))} <span class="pill">${esc(f.estado)}</span></h3>
              <p>${fmt(f.resumenActual)}</p>
            </a>`).join('')}
        </div>
      </section>

      <section class="wrap block" id="biblioteca">
        <header class="sec-head">
          <p class="eyebrow">La Biblioteca</p>
          <h2>Los siete Tomos</h2>
          <p>La Línea Temporal de las Grandes Guerras, narrada capítulo a capítulo. Cada lomo muestra en su borde los colores de las facciones que participan.</p>
        </header>
        <div class="shelf">
          ${L.tomos.map(t => {
            const span = t.anios[1] - t.anios[0];
            const h = 270 + Math.round((span / maxSpan) * 90);
            return `
            <a class="spine" href="#${t.id}" style="--h:${h}px" aria-label="Tomo ${t.num}: ${esc(t.titulo)}">
              <span class="spine-bands">${t.ficha.facciones.map(id => `<i style="--fc:${facColor(id)}"></i>`).join('')}</span>
              <span class="spine-num">${t.num}</span>
              <span class="spine-title">${esc(t.titulo)}</span>
              <span class="spine-years">${esc(t.periodo)}</span>
            </a>`;
          }).join('')}
        </div>
      </section>

      <section class="wrap block">
        <header class="sec-head">
          <p class="eyebrow">Cómo leer este archivo</p>
          <h2>Tres niveles de canon</h2>
          <p>Todo dato indica su origen, para que recuerdos, decisiones e invenciones no se mezclen por accidente.</p>
        </header>
        <div class="legend-grid">
          <div class="legend-item">${badge('O')}<p>Texto literal de tu web Holocrón Galáctico (2025), recuperado del código fuente. Es el canon firme.</p></div>
          <div class="legend-item">${badge('A')}<p>Decisiones que tomaste al reconstruir el lore el 2 de octubre de 2026.</p></div>
          <div class="legend-item">${badge('P')}<p>Detalles propuestos para rellenar huecos. En el texto aparecen <span class="prop" title="Propuesta: pendiente de aprobación">subrayados con puntos</span>. Puedes ocultar el subrayado con el botón «Propuestas».</p></div>
        </div>
      </section>`;
  }

  /* ---------------------------------------------------- tomo */
  function viewTomo(t) {
    const i = L.tomos.indexOf(t);
    const prev = L.tomos[i - 1], next = L.tomos[i + 1];
    const f = t.ficha;
    return `
      <div class="wrap page">
        <nav class="crumbs"><a href="#inicio">Biblioteca</a> / Tomo ${t.num}</nav>
        <header class="tomo-head">
          <div class="tomo-num" aria-hidden="true">${t.num}</div>
          <div>
            <p class="eyebrow">Tomo ${t.num} · ${fmt(t.periodo)}</p>
            <h1>${esc(t.titulo)}</h1>
            <div class="chips">${f.facciones.map(facChip).join('')}</div>
          </div>
        </header>
        <div class="reader-grid">
          <aside class="toc">
            <p class="label">En este tomo</p>
            <ol>
              ${t.capitulos.map((c, n) => `<li><a href="#${t.id}.c${n + 1}"><span>${n + 1}</span>${esc(c.titulo)}</a></li>`).join('')}
              <li><a href="#${t.id}.ficha"><span>◇</span>Ficha del Tomo</a></li>
              <li><a href="#${t.id}.juegos"><span>◇</span>Para videojuegos</a></li>
            </ol>
            <div class="toc-pager">
              ${prev ? `<a href="#${prev.id}">← Tomo ${prev.num}</a>` : ''}
              ${next ? `<a href="#${next.id}">Tomo ${next.num} →</a>` : `<a href="#inicio">Volver a la Biblioteca</a>`}
            </div>
          </aside>
          <article class="prose">
            <figure class="record">
              <figcaption><span class="label">Registro original del Holocrón</span>${badge('O')}</figcaption>
              <blockquote>${esc(t.original)}</blockquote>
              ${t.notaOriginal ? `<p class="note">Nota: ${esc(t.notaOriginal)}</p>` : ''}
            </figure>
            <p class="synopsis">${fmt(t.sinopsis)}</p>

            ${t.capitulos.map((c, n) => `
              <section class="chapter" id="${t.id}.c${n + 1}">
                <header>
                  <p class="label">Capítulo ${n + 1}</p>
                  <h2>${esc(c.titulo)}</h2>
                  <div class="ch-src"><span class="label">Fuentes</span><span class="badges">${c.base.split(/\s+/).map(badge).join('')}</span></div>
                </header>
                ${paras(c.texto)}
              </section>`).join('')}

            <hr class="divider">
            <section class="sheet" id="${t.id}.ficha">
              <p class="eyebrow">Datos</p>
              <h2>Ficha del Tomo ${t.num}</h2>
              <dl class="facts">
                <dt>Periodo</dt><dd>${fmt(t.periodo)}</dd>
                <dt>Facciones</dt><dd><div class="chips">${f.facciones.map(facChip).join('')}</div></dd>
                <dt>Personajes</dt><dd>${f.personajes.map(perLink).join(' · ')}</dd>
                ${f.batallas.length ? `<dt>Batallas</dt><dd>${f.batallas.map(batLink).join(' · ')}</dd>` : ''}
                <dt>Lugares</dt><dd>${t.lugares.map(lugLink).join(' · ')}</dd>
                <dt>Territorio</dt><dd>${fmt(f.territorio)}</dd>
                <dt>Muertes</dt><dd>${fmt(f.muertes)}</dd>
                <dt>Nuevos líderes</dt><dd>${fmt(f.lideres)}</dd>
                <dt>Tecnología</dt><dd>${fmt(f.tecnologia)}</dd>
                <dt>Consecuencias</dt><dd>${fmt(f.consecuencias)}</dd>
              </dl>
            </section>
            <section class="sheet" id="${t.id}.juegos">
              <p class="eyebrow">Semillas</p>
              <h2>Para videojuegos</h2>
              <ul class="hooks">${t.juegos.map(j => `<li>${fmt(j)}</li>`).join('')}</ul>
            </section>
            <nav class="pager">
              ${prev ? `<a href="#${prev.id}"><span class="label">← Anterior</span><strong>Tomo ${prev.num}. ${esc(prev.titulo)}</strong></a>` : ''}
              ${next ? `<a class="next" href="#${next.id}"><span class="label">Siguiente →</span><strong>Tomo ${next.num}. ${esc(next.titulo)}</strong></a>`
                     : `<a class="next" href="#inicio"><span class="label">Fin de la crónica</span><strong>${esc(L.epilogo.titulo)}</strong></a>`}
            </nav>
          </article>
        </div>
      </div>`;
  }

  /* ---------------------------------------------------- facciones */
  function viewFacciones() {
    return `
      <div class="wrap page">
        <header class="sec-head">
          <p class="eyebrow">Códice de Facciones</p>
          <h1 class="hero-title" style="font-size:var(--step-3)">Las civilizaciones</h1>
          <p>Cada facción tiene su historia, su cultura y sus ambiciones. El texto del códice original abre cada ficha, y después vienen la historia completa, los gobernantes, el ejército y las notas de jugabilidad.</p>
        </header>
        <div class="fac-grid">
          ${L.facciones.map(f => `
            <a class="fac-card" href="#faccion-${f.id}" style="--fc:${f.color}">
              <span class="pill" style="justify-self:start">${esc(f.estado)}</span>
              <h3>${esc(f.nombre)}</h3>
              <p class="lema">${fmt(f.lema)}</p>
              <p>${fmt(f.codice.split('. ').slice(0, 2).join('. '))}.</p>
            </a>`).join('')}
        </div>
      </div>`;
  }

  function viewFaccion(f) {
    const people = L.personajes.filter(p => p.faccion === f.id);
    const others = L.facciones.filter(x => x.id !== f.id);
    return `
      <div class="wrap page" style="--fc:${f.color}">
        <nav class="crumbs"><a href="#facciones">Códice de Facciones</a> / ${esc(f.nombre)}</nav>
        <header class="fac-head">
          <p class="eyebrow">Códice de Facciones</p>
          <h1>${esc(f.nombre)}</h1>
          ${f.alias ? `<p class="muted">${esc(f.alias)}</p>` : ''}
          <div class="chips">
            <span class="pill">${esc(f.estado)}</span>
            ${['historia', 'gobernantes', 'ejercito', 'cultura', 'relaciones', 'presente', 'juego'].map(s =>
              `<a class="chip" href="#faccion-${f.id}.${s}">${{ historia: 'Historia', gobernantes: 'Gobernantes', ejercito: 'Ejército', cultura: 'Cultura', relaciones: 'Relaciones', presente: 'Presente', juego: 'Jugabilidad' }[s]}</a>`).join('')}
          </div>
        </header>
        <div class="fac-layout">
          <div class="fac-main">
            <figure class="record" style="margin:0">
              <figcaption><span class="label">Códice original</span>${badge('O')}</figcaption>
              <blockquote>${esc(f.codice)}</blockquote>
            </figure>

            <section class="fac-sec" id="faccion-${f.id}.historia">
              <h2>Historia</h2>
              <ol class="era-list">${f.historia.map(h => `<li><div><h3>${fmt(h.titulo)}</h3><p>${fmt(h.texto)}</p></div></li>`).join('')}</ol>
            </section>

            <section class="fac-sec" id="faccion-${f.id}.gobernantes">
              <h2>Gobernantes y líderes</h2>
              <div class="table-wrap"><table>
                <thead><tr><th>Nombre</th><th>Título</th><th>Periodo</th><th>Nota</th></tr></thead>
                <tbody>${f.gobernantes.map(g => `<tr><td><strong>${fmt(g.nombre)}</strong></td><td>${fmt(g.titulo)}</td><td class="num">${fmt(g.periodo)}</td><td>${fmt(g.nota)}</td></tr>`).join('')}</tbody>
              </table></div>
            </section>

            <section class="fac-sec" id="faccion-${f.id}.ejercito">
              <h2>${f.id === 'sintonia' ? 'Caballeros y poderes' : 'Ejército'}</h2>
              <div class="unit-list">${f.ejercito.map(e => `<div class="unit"><h3>${fmt(e.nombre)}</h3><p>${fmt(e.texto)}</p></div>`).join('')}</div>
            </section>

            <section class="fac-sec" id="faccion-${f.id}.cultura">
              <h2>Cultura</h2>
              <p>${fmt(f.cultura)}</p>
            </section>

            <section class="fac-sec" id="faccion-${f.id}.relaciones">
              <h2>Relaciones</h2>
              <div>${f.relaciones.map(r => { const o = fac(r.con); return `
                <div class="rel">
                  <a href="#faccion-${o.id}" style="--fc:${o.color}"><i class="dot"></i>${esc(o.nombre)}</a>
                  <span class="pill" style="justify-self:start">${esc(r.tipo)}</span>
                  <p>${fmt(r.texto)}</p>
                </div>`; }).join('')}</div>
            </section>

            <section class="fac-sec" id="faccion-${f.id}.presente">
              <h2>Situación actual</h2>

            </section>

            <section class="fac-sec" id="faccion-${f.id}.juego">

          <aside class="fac-side">
            <dl>
              <div><dt>Estado</dt><dd>${esc(f.estado)}${f.poder != null ? ` · peso ${f.poder}%` : ''}</dd></div>
              <div><dt>Lema</dt><dd>${fmt(f.lema)}</dd></div>

            </dl>

  }

  /* ---------------------------------------------------- batallas */
  function viewBatallas() {

  /* ---------------------------------------------------- cronología */
  function viewCronologia() {
    let lastTomo = undefined;
    const items = L.cronologia.map(c => {
      let head = '';
      if (c.tomo !== lastTomo) {
        const t = c.tomo ? tomoNum(c.tomo) : null;
        head = `<li class="tl-era" style="display:block">${t ? `Tomo ${t.num} · ${esc(t.titulo)}` : 'Antes de las Grandes Guerras'}</li>`;
        lastTomo = c.tomo;
      }
      return head + `
        <li>

          <div class="t-body">
            <p>${fmt(c.texto)}</p>

    return `
      <div class="wrap page">

        </header>

  }

  /* ---------------------------------------------------- mapa */
  const W = 160, H = 100;
  const px = l => ({ x: l.left / 100 * W, y: l.top / 100 * H });
  function viewMapa(selId) {
    return `
      <div class="wrap page">
        <header class="sec-head">
          <p class="eyebrow">Geografía</p>
          <h1 class="hero-title" style="font-size:var(--step-3)">Mapa Galáctico Conceptual</h1>
          <p>Las esferas de influencia tras la Última Gran Guerra. Las posiciones de los siete sistemas originales son las de tu web; el resto se han colocado según su papel en la historia. Pulsa un sistema para ver su ficha.</p>
        </header>
        <div class="map-controls">
          <label for="map-era">Resaltar</label>
          <select id="map-era">
            <option value="">Todos los sistemas</option>
            ${L.tomos.map(t => `<option value="${t.id}">Tomo ${t.num}. ${esc(t.titulo)}</option>`).join('')}
          </select>
        </div>
        <div class="map-layout">
          <div class="map-box">${mapSVG()}</div>
          <aside class="map-panel" id="map-panel" aria-live="polite"></aside>
        </div>
      </div>`;
  }
  function mapSVG() {
    const caps = { rilur: 'rilur-prime', dubitsa: 'dubitsa-prime', vinica: 'vinica-prime', principados: 'union-este', andalus: 'portus' };
    const spheres = Object.entries(caps).map(([fid, lid]) => {
      const f = fac(fid), p = px(lug(lid));
      const r = 7 + f.poder * 0.55;
      return `<circle class="map-sphere" cx="${p.x}" cy="${p.y}" r="${r}" fill="${f.color}" fill-opacity=".1" stroke="${f.color}" stroke-opacity=".45" ${fid === 'andalus' ? 'stroke-dasharray="1 .8"' : ''}/>`;
    }).join('');
    const rings = [14, 28, 42].map(r => `<ellipse class="map-ring" cx="${W / 2}" cy="${H / 2}" rx="${r * 1.55}" ry="${r}"/>`).join('');
    const grid = [];
    for (let x = 20; x < W; x += 20) grid.push(`<line class="map-grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`);
    for (let y = 20; y < H; y += 20) grid.push(`<line class="map-grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`);
    const pts = L.lugares.map(l => {
      const p = px(l);
      const color = l.faccion === 'neutral' ? '#a855f7' : facColor(l.faccion);
      const right = p.x < 128;
      return `
        <g class="map-pt" data-id="${l.id}" tabindex="0" role="button" aria-label="${esc(plain(l.nombre))}">
          <circle class="halo" cx="${p.x}" cy="${p.y}" r="3"/>
          <circle class="core" cx="${p.x}" cy="${p.y}" r="1.4" fill="${color}"/>
          <text x="${right ? p.x + 2.6 : p.x - 2.6}" y="${p.y + .9}" text-anchor="${right ? 'start' : 'end'}">${esc(plain(l.nombre))}</text>
        </g>`;
    }).join('');
    const portus = px(lug('portus')), vac = px(lug('paso-vacio'));
    return `
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Mapa galáctico">
        ${grid.join('')}${rings}${spheres}
        <path class="map-route" d="M${portus.x} ${portus.y} L${vac.x} ${vac.y}"/>
        <text class="map-note" x="${W - 2}" y="${vac.y + 4.5}" text-anchor="end">→ galaxia de Andalus</text>
        <text class="map-note" x="2" y="${H - 2}">Esferas: influencia en el presente (68 DO) · línea discontinua = restos dispersos</text>
        ${pts}
      </svg>`;
  }
  function mapPanel(id) {
    const panel = document.getElementById('map-panel');
    if (!panel) return;
    const l = lug(id);
    if (!l) {
      panel.innerHTML = `<p class="label">Leyenda</p>
        ${L.facciones.filter(f => f.id !== 'sintonia').map(f => `<p class="kv"><i class="dot" style="--fc:${f.color}"></i> ${esc(f.nombre)}</p>`).join('')}
        <p class="kv"><i class="dot" style="--fc:#9ca3af"></i> Caballeros de la Sintonía</p>
        <p class="kv"><i class="dot" style="--fc:#a855f7"></i> Neutral / campo de batalla</p>
        <p class="muted" style="font-size:.88rem">Selecciona un sistema en el mapa para ver su historia.</p>`;
      return;
    }
    const bs = L.batallas.filter(b => b.lugar === l.id);
    panel.innerHTML = `
      <p class="label">${fmt(l.tipo)}</p>
      <h3>${fmt(l.nombre)}</h3>
      <div class="chips">${l.faccion !== 'neutral' ? facChip(l.faccion) : `<span class="chip"><i class="dot" style="--fc:#a855f7"></i>${esc(l.afiliacion)}</span>`}${badge(l.src)}</div>
      <p>${fmt(l.texto)}</p>
      ${bs.length ? `<p class="label">Batallas aquí</p><p style="font-size:.9rem">${bs.map(b => batLink(b.id)).join('<br>')}</p>` : ''}`;
    document.querySelectorAll('.map-pt').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
  }
  function mapEra(tid) {
    const t = L.tomos.find(x => x.id === tid);
    document.querySelectorAll('.map-pt').forEach(g => g.classList.toggle('dim', !!t && !t.lugares.includes(g.dataset.id)));
  }

  /* ---------------------------------------------------- glosario */
  function viewGlosario() {
    const items = L.glosario.slice().sort((a, b) => plain(a.t).localeCompare(plain(b.t), 'es'));
    return `
      <div class="wrap page">
        <header class="sec-head">
          <p class="eyebrow">Términos</p>
          <h1 class="hero-title" style="font-size:var(--step-3)">Glosario</h1>
          <p>Conceptos, órdenes, tecnologías y tratados del universo.</p>
        </header>
        <dl class="gloss" style="max-width:960px">
          ${items.map(g => `<dt>${fmt(g.t)}${badge(g.src)}</dt><dd>${fmt(g.d)}</dd>`).join('')}
        </dl>
      </div>`;
  }

  /* ---------------------------------------------------- canon */
  function viewCanon() {
    const C = L.canon;
    return `
      <div class="wrap page">
        <header class="sec-head">
          <p class="eyebrow">Registro</p>
          <h1 class="hero-title" style="font-size:var(--step-3)">Registro de canon</h1>
          <p>De dónde sale cada dato, qué decidiste al reconstruir el lore y qué falta por cerrar antes de declarar el canon definitivo.</p>
        </header>
        <div class="canon-grid">
          <section class="fac-sec">
            <h2>Fuentes</h2>
            <dl class="qa">${C.fuentes.map(f => `<div><dt>${esc(f.nombre)}</dt><dd>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.url)}</a><br>` : ''}${esc(f.nota)}</dd></div>`).join('')}</dl>
          </section>
          <section class="fac-sec">
            <h2>Tus decisiones (2 oct 2026) ${badge('A')}</h2>
            <dl class="qa">${C.decisiones.map(d => `<div><dt>${esc(d.p)}</dt><dd>${esc(d.r)}</dd></div>`).join('')}</dl>
          </section>
          <section class="fac-sec">
            <h2>Propuestas por aprobar ${badge('P')}</h2>
            <p class="muted">Todo lo que inventé para unir las piezas. Cada una puede aprobarse, cambiarse o descartarse.</p>
            <ul class="checklist">${C.propuestas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          </section>
          <section class="fac-sec">
            <h2>Preguntas abiertas</h2>
            <ul class="checklist" style="--fc:var(--brass)">${C.pendientes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          </section>
          <section class="fac-sec">
            <h2>Exportar</h2>
            <p class="muted">Copia la Biblia completa para guardarla o para usarla en un motor de juego. En tu carpeta también están <span class="mono">BIBLIA_CANON.md</span> y <span class="mono">lore.json</span>.</p>
            <div class="export">
              <button class="btn" id="copy-md">Copiar Biblia en Markdown</button>
              <button class="btn ghost" id="copy-json">Copiar datos en JSON</button>
            </div>
            <p class="toast" id="toast" role="status"></p>
            <div id="fallback"></div>
          </section>
        </div>
      </div>`;
  }
  function copyText(text, what) {
    const toast = document.getElementById('toast');
    const fb = document.getElementById('fallback');
    const done = () => { toast.textContent = what + ' copiado al portapapeles (' + Math.round(text.length / 1024) + ' KB).'; fb.innerHTML = ''; };
    const fail = () => {
      toast.textContent = 'No se pudo copiar automáticamente. Selecciona el texto de abajo y cópialo.';
      fb.innerHTML = '<textarea class="copy-fallback" id="fb-text" readonly></textarea>';
      const ta = document.getElementById('fb-text'); ta.value = text; ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  /* ---------------------------------------------------- estrellas */
  function drawStars() {
    const c = document.querySelector('.stars');
    if (!c) return;
    const r = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    const rgb = getComputedStyle(document.documentElement).getPropertyValue('--star').trim() || '231,227,215';
    let s = 7;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const n = Math.round(r.width * r.height / 2600);
    for (let i = 0; i < n; i++) {
      const x = rnd() * r.width, y = rnd() * r.height, big = rnd() > .94;
      ctx.fillStyle = `rgba(${rgb},${(.15 + rnd() * .5).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(x, y, big ? 1.3 : .7, 0, Math.PI * 2); ctx.fill();
    }
    // brazo galáctico tenue a la derecha
    const g = ctx.createRadialGradient(r.width * .82, r.height * .45, 0, r.width * .82, r.height * .45, r.width * .35);
    g.addColorStop(0, `rgba(${rgb},.07)`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  }

  /* ---------------------------------------------------- router */
  const NAV = [['inicio', 'Biblioteca'], ['facciones', 'Facciones'], ['personajes', 'Personajes'], ['batallas', 'Batallas'], ['cronologia', 'Cronología'], ['mapa', 'Mapa'], ['glosario', 'Glosario'], ['canon', 'Canon']];
  function navFor(key) {
    if (key.startsWith('tomo-')) return 'inicio';
    if (key.startsWith('faccion-')) return 'facciones';
    if (key.startsWith('personaje-')) return 'personajes';
    if (key.startsWith('batalla-')) return 'batallas';
    if (key.startsWith('lugar-')) return 'mapa';
    return key;
  }
  let current = null;
  function route() {
    const hash = decodeURIComponent(location.hash.slice(1)) || 'inicio';
    const key = hash.split('.')[0];
    let html = null, after = null, viewKey = key;

    if (key === 'inicio' || key === 'biblioteca') { viewKey = 'inicio'; html = viewHome; after = drawStars; }
    else if (key.startsWith('tomo-')) { const t = L.tomos.find(x => x.id === key); if (t) html = () => viewTomo(t); }
    else if (key === 'facciones') html = viewFacciones;
    else if (key.startsWith('faccion-')) { const f = fac(key.slice(8)); if (f) html = () => viewFaccion(f); }
    else if (key === 'personajes' || key.startsWith('personaje-')) {
      viewKey = 'personajes'; html = viewPersonajes;
      after = () => {
        bindPeople();
        const d = key.startsWith('personaje-') && document.getElementById(key);
        if (d) { d.open = true; d.classList.add('flash'); }
      };
    }
    else if (key === 'batallas' || key.startsWith('batalla-')) {
      viewKey = 'batallas'; html = viewBatallas;
      after = () => { const r = key.startsWith('batalla-') && document.getElementById(key); if (r) r.classList.add('flash'); };
    }
    else if (key === 'cronologia') html = viewCronologia;
    else if (key === 'mapa' || key.startsWith('lugar-')) {
      viewKey = 'mapa'; html = () => viewMapa();
      after = () => { bindMap(); mapPanel(key.startsWith('lugar-') ? key.slice(6) : null); };
    }
    else if (key === 'glosario') html = viewGlosario;
    else if (key === 'canon') {
      html = viewCanon;
      after = () => {
        document.getElementById('copy-md').onclick = () => copyText(L.aMarkdown(new Date().toISOString().slice(0, 10)), 'Markdown');
        document.getElementById('copy-json').onclick = () => copyText(L.aJSON(), 'JSON');
      };
    }
    if (!html) { location.hash = '#inicio'; return; }

    const sameView = current === key && hash.includes('.');
    if (!sameView) {
      app.innerHTML = html();
      if (after) after();
      current = key;
    }
    document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.k === navFor(viewKey) ? 'page' : 'false'));
    const target = hash.includes('.') ? document.getElementById(hash) : (key.match(/^(personaje|batalla)-/) ? document.getElementById(key) : null);
    if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
    else if (!sameView) window.scrollTo(0, 0);
    const t = L.tomos.find(x => x.id === key);
    document.title = (t ? 'Tomo ' + t.num + ' · ' : '') + 'Holocrón Galáctico';
  }

  function bindPeople() {
    const btns = document.querySelectorAll('.toolbar .chip');
    btns.forEach(b => b.addEventListener('click', () => {
      btns.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      document.querySelectorAll('.person').forEach(p => { p.hidden = !!b.dataset.f && p.dataset.f !== b.dataset.f; });
    }));
  }
  function bindMap() {
    document.querySelectorAll('.map-pt').forEach(g => {
      const go = () => { history.replaceState(null, '', '#lugar-' + g.dataset.id); current = 'lugar-' + g.dataset.id; mapPanel(g.dataset.id); };
      g.addEventListener('click', go);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    const sel = document.getElementById('map-era');
    sel.addEventListener('change', () => mapEra(sel.value));
  }

  /* ---------------------------------------------------- cabecera, tema y propuestas */
  document.getElementById('nav').innerHTML = NAV.map(([k, label]) => `<a href="#${k}" data-k="${k}">${label}</a>`).join('');
  const themeBtn = document.getElementById('theme-btn');
  const THEMES = ['sistema', 'oscuro', 'claro'];
  function applyTheme(t) {
    if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark');
    else if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = 'Tema: ' + t;
    drawStars();
  }
  let theme = store.get('holocron-tema') || 'sistema';
  if (!THEMES.includes(theme)) theme = 'sistema';
  themeBtn.addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    store.set('holocron-tema', theme);
    applyTheme(theme);
  });
  const propBtn = document.getElementById('prop-btn');
  function applyProp(on) {
    document.documentElement.classList.toggle('hide-prop', !on);
    propBtn.textContent = on ? 'Propuestas: visibles' : 'Propuestas: ocultas';
    propBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  let propOn = store.get('holocron-prop') !== 'no';
  propBtn.addEventListener('click', () => { propOn = !propOn; store.set('holocron-prop', propOn ? 'si' : 'no'); applyProp(propOn); });

  window.addEventListener('hashchange', route);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawStars, 150); });
  applyProp(propOn);
  route();
  applyTheme(theme);
})();

</script>
</body>
</html>
